name: Sync external listings

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync
        run: |
          code=$(curl -s -o /tmp/sync-response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://bazarnik.vercel.app/api/cron/sync)
          cat /tmp/sync-response.json
          test "$code" = "200"
